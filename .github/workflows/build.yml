name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LostPenguin.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LostPenguin
          path: app/build/outputs/apk/debug/LostPenguin.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: LostPenguin v0.0.${{ github.run_number }}
          body: "Build #${{ github.run_number }} — commit ${{ github.sha }}"
          files: app/build/outputs/apk/debug/LostPenguin.apk
          token: ${{ secrets.GITHUB_TOKEN }}
